<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DFX 能力架构全景图 / DFT-大数据观测 架构 0 层图</title>
<style>
  :root {
    --bg: #f4f6fa;
    --panel: #ffffff;
    --ink: #1b2537;
    --ink-sub: #5b6880;
    --line: #dde3ed;
    --shadow: 0 1px 2px rgba(27, 37, 55, .06), 0 8px 24px rgba(27, 37, 55, .06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans CJK SC", system-ui, sans-serif;
    line-height: 1.6;
  }

  header {
    background: linear-gradient(135deg, #16223c 0%, #24406e 100%);
    color: #fff;
    padding: 28px 32px 22px;
  }

  header h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }

  header p { margin: 6px 0 0; font-size: 13px; color: #b9c6dd; }

  .tabs { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

  .tab {
    border: 1px solid rgba(255, 255, 255, .28);
    background: rgba(255, 255, 255, .08);
    color: #dce5f5;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }

  .tab:hover { background: rgba(255, 255, 255, .16); }

  .tab[aria-selected="true"] { background: #fff; color: #16223c; border-color: #fff; font-weight: 600; }

  main { padding: 24px 32px 56px; max-width: 1560px; margin: 0 auto; }

  .diagram-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }

  .diagram-head h2 { margin: 0; font-size: 18px; }

  .diagram-head .desc { margin: 4px 0 0; font-size: 13px; color: var(--ink-sub); }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-sub); }

  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  .layer {
    display: grid;
    grid-template-columns: 116px 1fr;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 12px;
  }

  .layer-label {
    padding: 16px 12px;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    text-align: center;
  }

  .layer-label b { font-size: 14px; font-weight: 600; }

  .layer-label small { font-size: 11px; opacity: .82; line-height: 1.4; }

  .layer-body {
    padding: 14px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(216px, 1fr));
    gap: 10px;
  }

  .group {
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 10px 12px;
    background: #fcfdff;
    transition: box-shadow .15s, transform .15s;
  }

  .group:hover { box-shadow: var(--shadow); transform: translateY(-1px); }

  .group h3 { margin: 0 0 8px; font-size: 13.5px; font-weight: 600; }

  .group ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }

  .group li {
    font-size: 12px;
    color: var(--ink-sub);
    background: #eef2f9;
    border-radius: 5px;
    padding: 3px 8px;
    white-space: nowrap;
  }

  .flow {
    text-align: center;
    font-size: 12px;
    color: var(--ink-sub);
    margin: 0 0 12px;
  }

  footer { padding: 0 32px 40px; max-width: 1560px; margin: 0 auto; font-size: 12px; color: var(--ink-sub); }

  footer a { color: #2c5cc5; }

  @media print {
    header { background: #16223c !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .tabs { display: none; }
    .layer { break-inside: avoid; }
  }
</style>
</head>
<body>

  <div class="tabs" role="tablist" id="tabs"></div>
</header>

<main>
  <div class="diagram-head">
    <div>
      <h2 id="diagram-title"></h2>
      <p class="desc" id="diagram-desc"></p>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <p>修改方式：编辑本文件中的 <code>DIAGRAMS</code> 数据结构即可，渲染逻辑无需改动。</p>

const tabsEl = document.getElementById('tabs');
const canvasEl = document.getElementById('canvas');
const legendEl = document.getElementById('legend');
const titleEl = document.getElementById('diagram-title');
const descEl = document.getElementById('diagram-desc');
const flowEl = document.getElementById('flow');

function renderDiagram(key) {
  const diagram = DIAGRAMS[key];
  titleEl.textContent = diagram.title;
  descEl.textContent = diagram.desc;
  flowEl.textContent = diagram.flow;

  legendEl.replaceChildren(...diagram.legend.map(item => {
    const span = document.createElement('span');
    const swatch = document.createElement('i');
    swatch.style.background = item.color;
    span.append(swatch, item.text);
    return span;
  }));

  canvasEl.replaceChildren(...diagram.layers.map(layer => {
    const section = document.createElement('section');
    section.className = 'layer';

    const label = document.createElement('div');
    label.className = 'layer-label';
    label.style.background = layer.color;
    const name = document.createElement('b');
    name.textContent = layer.name;
    const note = document.createElement('small');
    note.textContent = layer.note;
    label.append(name, note);

    const body = document.createElement('div');
    body.className = 'layer-body';
    layer.groups.forEach(group => {
      const card = document.createElement('div');
      card.className = 'group';
      card.style.setProperty('--accent', layer.color);
      const heading = document.createElement('h3');
      heading.textContent = group.name;
      const list = document.createElement('ul');
      group.items.forEach(text => {
        const li = document.createElement('li');
        li.textContent = text;
        list.appendChild(li);
      });
      card.append(heading, list);
      body.appendChild(card);
    });

    section.append(label, body);
    return section;
  }));

  Array.from(tabsEl.children).forEach(btn => {
    btn.setAttribute('aria-selected', String(btn.dataset.key === key));
  });
}

Object.entries(DIAGRAMS).forEach(([key, diagram]) => {
  const btn = document.createElement('button');
  btn.className = 'tab';
  btn.type = 'button';
  btn.role = 'tab';
  btn.dataset.key = key;
  btn.textContent = diagram.tab;
  btn.addEventListener('click', () => renderDiagram(key));
  tabsEl.appendChild(btn);
});

renderDiagram('dfx');
